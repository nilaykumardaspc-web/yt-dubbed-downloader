<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubbedStream Pro - NILAY KMR DAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
            width: 100%;
            max-width: 650px;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .spinner-border {
            display: none;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="main-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fa-brands fa-youtube text-danger me-2"></i>DubbedStream Pro</h2>
            <p class="text-secondary mb-0">Powered by <strong>NILAY KMR DAS</strong></p>
        </div>

        <div class="mb-3">
            <label for="videoUrl" class="form-label">YouTube Video URL</label>
            <div class="input-group">
                <input type="text" class="form-control" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn btn-primary" id="fetchBtn" onclick="fetchAudioTracks()">
                    <span class="spinner-border spinner-border-sm me-1" id="fetchSpinner"></span>
                    Scan Audio
                </button>
            </div>
        </div>

        <div id="selectionArea" style="display: none;">
            <div class="mb-3">
                <label for="audioSelect" class="form-label">Choose Audio / Dubbed Track</label>
                <select class="form-select" id="audioSelect"></select>
            </div>

            <div class="mb-3">
                <label for="qualitySelect" class="form-label">Video Quality</label>
                <select class="form-select" id="qualitySelect">
                    <option value="1080">1080p (Full HD)</option>
                    <option value="720" selected>720p (HD)</option>
                    <option value="480">480p (Standard)</option>
                    <option value="360">360p (Low Data)</option>
                </select>
            </div>

            <button class="btn btn-success w-100 py-2 fw-semibold" id="downloadBtn" onclick="triggerDownload()">
                <span class="spinner-border spinner-border-sm me-1" id="dlSpinner"></span>
                <i class="fa-solid fa-download me-1"></i> Start Download
            </button>
        </div>

        <div id="statusAlert" class="alert mt-3 d-none" role="alert"></div>
    </div>
</div>

<script>
    async function fetchAudioTracks() {
        const url = document.getElementById('videoUrl').value.trim();
        const alertBox = document.getElementById('statusAlert');
        const fetchBtn = document.getElementById('fetchBtn');
        const spinner = document.getElementById('fetchSpinner');
        const selectionArea = document.getElementById('selectionArea');
        const audioSelect = document.getElementById('audioSelect');

        if (!url) {
            showAlert('Please enter a YouTube video URL.', 'warning');
            return;
        }

        showAlert('Scanning available dubbed audio tracks...', 'info');
        fetchBtn.disabled = true;
        spinner.style.display = 'inline-block';
        selectionArea.style.display = 'none';

        try {
            const response = await fetch('/get-audio-tracks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to scan tracks');
            }

            audioSelect.innerHTML = '';
            data.tracks.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.format_id;
                opt.textContent = `${t.language} (${t.note || 'Default'})`;
                audioSelect.appendChild(opt);
            });

            selectionArea.style.display = 'block';
            showAlert(`Found ${data.tracks.length} audio stream(s)! Select track and download.`, 'success');
        } catch (err) {
            showAlert(err.message, 'danger');
        } finally {
            fetchBtn.disabled = false;
            spinner.style.display = 'none';
        }
    }

    function triggerDownload() {
        const url = document.getElementById('videoUrl').value.trim();
        const audioFormatId = document.getElementById('audioSelect').value;
        const resolution = document.getElementById('qualitySelect').value;
        const alertBox = document.getElementById('statusAlert');
        const dlBtn = document.getElementById('downloadBtn');
        const dlSpinner = document.getElementById('dlSpinner');

        if (!url || !audioFormatId) {
            showAlert('Missing video or audio selection.', 'warning');
            return;
        }

        showAlert('Processing video and merging dubbed audio on server... Please wait!', 'info');
        dlBtn.disabled = true;
        dlSpinner.style.display = 'inline-block';

        const params = new URLSearchParams({
            url: url,
            audio_format_id: audioFormatId,
            resolution: resolution
        });

        window.location.href = `/download?${params.toString()}`;

        setTimeout(() => {
            dlBtn.disabled = false;
            dlSpinner.style.display = 'none';
            showAlert('Download sent to browser!', 'success');
        }, 10000);
    }

    function showAlert(msg, type) {
        const alertBox = document.getElementById('statusAlert');
        alertBox.className = `alert alert-${type} mt-3`;
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
    }
</script>

</body>
</html>
